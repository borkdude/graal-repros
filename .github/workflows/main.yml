name: Class.forName Crema repro

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  repro:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM EA
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25e1-ea'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: bash build.sh

      - name: Run repro (expected to fail)
        run: |
          ./main 2>&1 | head -3 || true
          ./main 2>&1 | grep -q "Class.forName" && echo "Bug reproduced: Class.forName not dispatchable"
